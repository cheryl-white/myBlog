name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # ← 修正缩进：与 uses 平齐，缩进两个空格
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build VitePress site
        run: npm run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }} # ← 修正变量引用：deployment → deploy
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions: # ← 新增：明确为 deploy 任务授予 pages 权限
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deploy # ← 修正 id：与前面的引用保持一致
        uses: actions/deploy-pages@v4
